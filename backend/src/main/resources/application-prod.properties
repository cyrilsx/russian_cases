# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# All values come from environment variables; there are deliberately NO defaults
# for the secrets, so the app refuses to start if they are missing.

server.port=${SERVER_PORT:8080}
# behind a reverse proxy (nginx / ingress) that terminates TLS
server.forward-headers-strategy=framework

# Secrets (required in prod — startup fails with a clear placeholder error if unset)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl-minutes=${APP_JWT_TTL_MINUTES:10080}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}

app.quiz.questions-per-session=${APP_QUIZ_QUESTIONS_PER_SESSION:15}

# Database: PostgreSQL recommended in prod (e.g. Exoscale Aiven for PostgreSQL).
# Defaults to in-memory H2 ONLY for throwaway demos — data is lost on restart.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:russiancases;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
