spring.application.name=russian-cases-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:russiancases;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=en
spring.web.locale-resolver=accept-header

app.jwt.secret=dev-only-secret-change-me-0123456789abcdef0123456789abcdef0123456789abcdef
app.jwt.ttl-minutes=10080

app.admin.username=admin
app.admin.password=admin123456

app.quiz.questions-per-session=15
