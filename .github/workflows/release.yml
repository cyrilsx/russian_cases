name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-backend-webapp:
    name: Build backend + webapp JARs (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build backend and webapp
        run: mvn -B -ntp verify -pl webapp,backend
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v6
        with:
          name: russian-cases-backend-webapp-jars
          path: |
            backend/target/*.jar
            webapp/target/*.jar
          retention-days: 90

  build-android:
    name: Build Android APK (SDK setup on JDK 21, build on JDK 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          "$SDKMGR" "platforms;android-29" "build-tools;30.0.3"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
      - name: Build the APK (release-signed)
        run: mvn -B -ntp verify -pl android -Dandroid.sign.debug=false
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Add v2/v3 signatures and verify (apksigner)
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/30.0.3"
          APK=$(ls android/target/*.apk | head -1)
          "$BT/apksigner" sign --ks "$ANDROID_KEYSTORE" \
            --ks-pass "pass:$ANDROID_STORE_PASS" --key-pass "pass:$ANDROID_KEY_PASS" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" "$APK"
          "$BT/apksigner" verify --print-certs "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: russian-cases-android-apk
          path: android/target/*.apk
          retention-days: 90

  release:
    name: Publish GitHub release with artifacts
    needs: [build-backend-webapp, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: russian-cases-backend-webapp-jars
          path: dist/jars
      - uses: actions/download-artifact@v6
        with:
          name: russian-cases-android-apk
          path: dist/apk
      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/jars/*.jar dist/apk/*.apk
