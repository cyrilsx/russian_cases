name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

jobs:
  backend-webapp:
    name: Backend + Webapp (Spring Boot 4, JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test backend and webapp
        run: mvn -B -ntp verify -pl webapp,backend
      - name: Upload backend jar artifact
        uses: actions/upload-artifact@v6
        with:
          name: russian-cases-backend-jar
          path: backend/target/*.jar
          retention-days: 30
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v6
        with:
          name: russian-cases-backend-webapp-jars
          path: |
            backend/target/*.jar
            webapp/target/*.jar
          retention-days: 30

  webapp-e2e:
    name: Webapp integration checks (API contract + E2E smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Frontend/backend API contract check
        run: python3 webapp/tests/contract_check.py
      - name: Webapp E2E smoke test (mock API + DOM)
        run: node webapp/tests/e2e_smoke.mjs

  docker-image:
    name: Container image (Jib -> ghcr.io)
    runs-on: ubuntu-latest
    needs: backend-webapp
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build modules (tests run in backend-webapp)
        run: mvn -B -ntp install -DskipTests -pl webapp,backend
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image to ghcr.io (tagged with commit SHA + latest)
        if: github.ref == 'refs/heads/main'
        run: |
          mvn -B -ntp -pl backend jib:build -Dimage=ghcr.io/cyrilsx/russian_cases/backend:${{ github.sha }}
          mvn -B -ntp -pl backend jib:build -Dimage=ghcr.io/cyrilsx/russian_cases/backend:latest
      - name: Validate image build (pull requests, no push)
        if: github.ref != 'refs/heads/main'
        run: mvn -B -ntp -pl backend jib:dockerBuild -Dimage=russian-cases:pr

  android:
    name: Android APK (SDK setup on JDK 21, build on JDK 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          "$SDKMGR" "platforms;android-29" "build-tools;30.0.3"
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "8"
      - name: Build the APK
        run: mvn -B -ntp verify -pl android
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: russian-cases-android-apk
          path: android/target/*.apk
          retention-days: 30
